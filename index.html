  <section class="clues-container">
    <div class="clues-list">
      <h2>Across</h2>
      <ol id="clues-across">
        <li id="clue-1A">
          <button type="button" aria-pressed="false">
            <strong>1.</strong> Check color
          </button>
        </li>
        <li id="clue-3A">
          <button type="button" aria-pressed="false">
            <strong>3.</strong> Systematic review of a website or document for WCAG compliance
          </button>
        </li>
        <li id="clue-4A">
          <button type="button" aria-pressed="false">
            <strong>4.</strong> Next interactive item using a keyboard
          </button>
        </li>
        <li id="clue-6A">
          <button type="button" aria-pressed="false">
            <strong>6.</strong> Free, open-source screen reader for Windows
          </button>
        </li>
      </ol>
    </div>

    <div class="clues-list">
      <h2>Down</h2>
      <ol id="clues-down">
        <li id="clue-1D">
          <button type="button" aria-pressed="false">
            <strong>1.</strong> Synchronized text overlays for video dialogue and sound effects
          </button>
        </li>
        <li id="clue-2D">
          <button type="button" aria-pressed="false">
            <strong>2.</strong> WCAG principle ensuring content works reliably across current and future assistive tech
          </button>
        </li>
        <li id="clue-5D">
          <button type="button" aria-pressed="false">
            <strong>5.</strong> U.S. civil rights law prohibiting discrimination based on disability (abbr.)
          </button>
        </li>
      </ol>
    </div>
    <button id="check-puzzle-btn" type="button">Check Puzzle</button>
  </section>
